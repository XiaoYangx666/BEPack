name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - run: npm install --global npm@11.18.0
            - run: npm ci
            - run: npm run check
            - run: npm test
            - run: npm run build
            - run: npm run typecheck --workspace=create-mcbe
            - run: npm test --workspace=create-mcbe
            - run: npm run build --workspace=create-mcbe
