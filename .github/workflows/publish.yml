name: Publish to npm

on:
    push:
        tags:
            - "v*-beta.*"

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false
            - run: npm install --global npm@11.18.0
            - run: npm ci
            - name: Verify release versions match the tag
              shell: bash
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  cli_version="$(node -p "require('./package.json').version")"
                  scaffolder_version="$(node -p "require('./packages/create-mcbe/package.json').version")"
                  if [[ "$version" != "$cli_version" || "$version" != "$scaffolder_version" ]]; then
                    echo "Tag version $version must match @bepack/cli ($cli_version) and create-mcbe ($scaffolder_version)." >&2
                    exit 1
                  fi
            # Run package code before exposing the publish token.
            - run: npm run check
            - run: npm test
            - run: npm run build
            - run: npm run typecheck --workspace=create-mcbe
            - run: npm test --workspace=create-mcbe
            - run: npm run build --workspace=create-mcbe
            - name: Publish @bepack/cli
              run: npm publish --ignore-scripts --tag beta --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
            - name: Publish create-mcbe
              run: npm publish --workspace=packages/create-mcbe --ignore-scripts --tag beta
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
